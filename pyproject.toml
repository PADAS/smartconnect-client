[project]
name = "smartconnect-client"
version = "1.13.0"
description = "Python client for the SMART Connect (Spatial Monitoring and Reporting Tool) API"
authors = [{ name = "Chris Doehring", email = "chrisdo@earthranger.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
# Poetry auto-generated these; kept explicitly for PyPI parity. The license
# classifier is intentionally absent — the PEP 639 `license` expression
# above replaces it.
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
# Ranges match the constraints the previous Poetry build resolved the caret
# specifiers to (see that wheel's METADATA), so the published requirements
# are unchanged by the hatchling migration.
dependencies = [
    "pydantic>=1.10.0,<2.0.0",
    "pytz>=2025.0,<2026.0",
    "python-json-logger>=3.0.0,<4.0.0",
    "redis>=6.0.0,<7.0.0",
    "untangle>=1.1.1,<2.0.0",
    "dateparser>=1.2.0,<2.0.0",
    "timezonefinder>=8.0.0,<9.0.0",
    "environs>=9.3.0,<10.0.0",
    "numpy>=1.21.7,<2.0.0",
    "shapely>=2.0.0,<3.0.0",
    "httpx>=0.28.0,<0.29.0",
    "marshmallow<4.0.0",
]

[project.urls]
Repository = "https://github.com/PADAS/smartconnect-client"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-mock>=3.15.0,<4.0.0",
    "respx>=0.22.0,<0.23.0",
    "requests-mock>=1.12.1,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartconnect"]

[tool.hatch.build.targets.sdist]
include = ["smartconnect", "tests", "README.md", "LICENSE"]
