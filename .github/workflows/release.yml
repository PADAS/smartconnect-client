name: release

on:
  push:
    tags:
      - "v*.*.*"

# `id-token: write` is required for PyPI Trusted Publishing (OIDC).
# `contents: write` is required for the GitHub Release upload step.
permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Pin to a named environment so the PyPI Trusted Publisher config can
    # be scoped to `pypi` and PRs from forks cannot trigger a release.
    environment:
      name: pypi
      url: https://pypi.org/p/smartconnect-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Gate the release on the test suite passing against the tagged
        # commit. Without this, a broken tag would still ship to PyPI.
        run: uv run pytest -q

      - name: Verify pyproject version matches tag
        # The package version in pyproject.toml is static — make sure the
        # pushed tag matches it, otherwise the wheel will ship under a
        # version that doesn't reflect the tag.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(uv version --short)
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ($tag_version) and pyproject ($pkg_version) versions differ"
            exit 1
          fi
          echo "Tag and pyproject both at $pkg_version"

      - name: Build wheel and sdist
        run: uv build

      - name: Show built artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        # Trusted Publisher (OIDC) — no API token. Requires a one-time
        # config on pypi.org: pypi.org/manage/account/publishing/ →
        # add a trusted publisher for `smartconnect-client` pointing at
        # this repo, workflow `release.yml`, environment `pypi`.
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        # Keep the GitHub Release path too: existing consumers
        # (er-smart-sync's prior URL pin, etc.) still expect the wheel
        # at the release URL. The cost of also attaching to a GH
        # Release is negligible.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
